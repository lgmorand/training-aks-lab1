name: Build, create infra & deploy

on:
  push:
  workflow_dispatch:
    inputs:
        STORAGE_NAME:
          description: "Storage name"
          required: true
        RESOURCE_GROUP:
          description: 'Resource groupe Name'     
          required: true
        REGION:
          description: 'Region'     
          required: true
          default: "westeurope"
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        name: Checkout sources

      - uses: ruby/setup-ruby@v1
        name: Set up Ruby
        with:
          ruby-version: "3.3.0"

      - run: make upgrade install
        name: Set up build dependencies

      - run: make build
        name: Build sources

      - name: AZ Login
        run: az login --service-principal -u ${{ vars.AZ_LOGIN }} -p ${{ secrets.AZ_PASSWORD }} --tenant ${{ vars.AZ_TENANT }}

      - name: Create RG
        run: |
          az group create -n ${{ github.event.inputs.RESOURCE_GROUP }} -l ${{ github.event.inputs.REGION }} -o none
          printf $"\e[32m\u2714 Success \e[0m\n\n"

      - name: Create storage account
        run: |
          az storage account create -n ${{ github.event.inputs.STORAGE_NAME }}  -g ${{ github.event.inputs.RESOURCE_GROUP }}  --kind StorageV2 
          az storage blob service-properties update --account-name ${{ github.event.inputs.STORAGE_NAME }} --static-website  --index-document "index.html" --404-document "error.html"
          
          printf $"\e[32m\u2714 Success \e[0m\n\n"
        
      - uses: azure/CLI@v2
        name: Deploy
        with:
          azcliversion: 2.67.0
          inlineScript: |
            az config set extension.use_dynamic_install=yes_without_prompt
            CONNECTION_STRING=$(az storage account show-connection-string --name stoadp --resource-group rg_adp -o tsv)
            echo $CONNECTION_STRING
            az storage azcopy blob sync \
              --container "\$web" \
              --source "_site" \
              --connection-string "$CONNECTION_STRING"
